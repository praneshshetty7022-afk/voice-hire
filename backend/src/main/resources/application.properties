# Server Configuration
server.port=8082
server.servlet.context-path=/api

# Application Name
spring.application.name=voicehire

# MongoDB Configuration
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=voicehire
spring.data.mongodb.auto-index-creation=true

# MongoDB URI (alternative connection string)
# spring.data.mongodb.uri=mongodb://localhost:27017/voicehire

# JWT Configuration
jwt.secret=${JWT_SECRET:voicehire-secret-key-for-jwt-token-generation-2024}
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Mail Configuration (for notifications)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${EMAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Logging Configuration
logging.level.com.voicehire=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.data.mongodb=DEBUG

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# CORS Configuration (handled in CorsConfig.java)
# This is placeholder as actual CORS is configured in Java config

# Voice Processing Configuration
voice.recognition.language=en-US
voice.synthesis.language=en-US
voice.synthesis.rate=1.0
voice.synthesis.pitch=1.0

# Profile Configuration
spring.profiles.active=dev
