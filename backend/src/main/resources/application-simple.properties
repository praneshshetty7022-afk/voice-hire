# Simple configuration for testing without MongoDB
server.port=8080
server.servlet.context-path=/api

spring.application.name=voicehire

# Disable MongoDB temporarily
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration

# Logging
logging.level.com.voicehire=DEBUG
logging.level.org.springframework.web=INFO

# JWT configuration (simplified)
jwt.secret=${JWT_SECRET:voicehire-secret-key-for-testing}
jwt.expiration=86400000
