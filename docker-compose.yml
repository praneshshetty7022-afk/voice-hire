version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: voicehire-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: voicehire
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - voicehire-network

  # Optional: MongoDB Express for database management
  mongo-express:
    image: mongo-express:1.0.0
    container_name: voicehire-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - voicehire-network

  # Backend service (Node.js Express engine)
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: voicehire-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://admin:admin123@mongodb:27017/voicehire?authSource=admin
      JWT_SECRET: voicehire_super_secret_jwt_key_2026_udyoga_mitra_platform_secure_token
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: "*"
    depends_on:
      - mongodb
    networks:
      - voicehire-network

  # Frontend service (optional - for containerized deployment)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voicehire-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - voicehire-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  voicehire-network:
    driver: bridge
