version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: voicehire-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: voicehire
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - voicehire-network

  # Optional: MongoDB Express for database management
  mongo-express:
    image: mongo-express:1.0.0
    container_name: voicehire-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: admin123
      ME_CONFIG_MONGODB_URL: mongodb://admin:admin123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - voicehire-network

  # Backend service (optional - for containerized deployment)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: voicehire-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_HOST: mongodb
      SPRING_DATA_MONGODB_PORT: 27017
      SPRING_DATA_MONGODB_DATABASE: voicehire
      SPRING_DATA_MONGODB_USERNAME: admin
      SPRING_DATA_MONGODB_PASSWORD: admin123
    depends_on:
      - mongodb
    networks:
      - voicehire-network

  # Frontend service (optional - for containerized deployment)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: voicehire-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - voicehire-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  voicehire-network:
    driver: bridge
